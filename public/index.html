<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veyra — Tu Agenda y Recordatorios Inteligentes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0D0F12;
            --surface: #16191F;
            --surface-card: #20242D;
            --border: rgba(255, 255, 255, 0.08);
            --primary: #3B82F6;
            --primary-glow: rgba(59, 130, 246, 0.25);
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #F8FAFC;
                --surface: #FFFFFF;
                --surface-card: #F1F5F9;
                --border: rgba(0, 0, 0, 0.08);
                --primary: #2563EB;
                --primary-glow: rgba(37, 99, 235, 0.2);
                --text-primary: #0F172A;
                --text-secondary: #475569;
                --text-muted: #94A3B8;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            text-align: center;
        }
        .hero {
            max-width: 520px;
            width: 100%;
        }
        .logo-badge {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: linear-gradient(135deg, #3B82F6, #1D4ED8);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 10px 24px var(--primary-glow);
            margin-bottom: 24px;
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-bottom: 12px;
        }
        p {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 24px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-primary {
            background-color: var(--primary);
            color: #FFFFFF;
            box-shadow: 0 8px 24px var(--primary-glow);
        }
        .btn-secondary {
            background-color: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        footer {
            margin-top: 48px;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            gap: 16px;
        }
        footer a {
            color: var(--text-secondary);
            text-decoration: none;
        }
        footer a:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo-badge">⚡</div>
        <h1>Veyra</h1>
        <p>Tu sistema de productividad inteligente para recordatorios, calendario académico y notas sincronizadas.</p>
        <div class="actions">
            <a href="veyra://" class="btn btn-primary">Abrir App Veyra</a>
        </div>
        <footer>
            <a href="/privacy">Privacidad</a>
            <span>•</span>
            <a href="/terms">Términos</a>
        </footer>
    </div>
</body>
</html>
